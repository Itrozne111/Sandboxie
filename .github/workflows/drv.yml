name: Build Sandboxie

env:
  forbuildVariables: use Installer\buildVariables.cmd file

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Fetch Upstream]
    types:
      - completed

jobs:
  Build_x64:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      - name: Load Variables from buildVariables.cmd
        shell: cmd
        run: |
          @echo on
          call "${{ github.workspace }}\Installer\buildVariables.cmd" build_qt6
          echo qt6_version=%qt6_version% >> %GITHUB_ENV%
          echo qt_version=%qt6_version% >> %GITHUB_ENV%

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v2

      #
      # get version number
      #
      - name: get version number
        id: version_number
        shell: pwsh
        run: |
          $headers = @{
            'User-Agent' = 'GitHub-Actions'
            'Accept' = 'application/vnd.github.v3+json'
          }
          if ($env:GH_TOKEN) { $headers['Authorization'] = "token $env:GH_TOKEN" }

          function Get-GithubReleases($url) {
            try {
              $resp = Invoke-WebRequest -Uri $url -Headers $headers -UseBasicParsing -ErrorAction Stop
              if ($resp -and $resp.Content) { return $resp.Content | ConvertFrom-Json }
              return $null
            } catch {
              Write-Host "Warning: failed to fetch $url - $($_.Exception.Message)"
              return $null
            }
          }

          $response = Get-GithubReleases 'https://api.github.com/repos/sandboxie-plus/sandboxie/releases'
          if (-not $response -or $response.Count -eq 0) {
            Write-Host "No upstream releases found or request failed."
            $SbieVersion_remote = ''
          } else {
            $SbieVersion_remote = $response[0].tag_name
          }
          Write-Output "SBIEVERSION=$SbieVersion_remote" >> $Env:GITHUB_OUTPUT

          $response = Get-GithubReleases 'https://api.github.com/repos/itrozne111/sandboxie/releases'
          $skip = 'false'
          if ($response -and $response.Count -gt 0) {
            $SbieVersion_local = $response[0].tag_name
            if ($SbieVersion_remote -ne '' -and $SbieVersion_remote -eq $SbieVersion_local) {
              Write-Host "Upstream and local release tags match. Skipping build."
              $skip = 'true'
            }
          } else {
            Write-Host "No releases found for itrozne111/sandboxie or request failed. Skipping local comparison."
          }
          Write-Output "skip=$skip" >> $Env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      #
      # Patch source files
      #
      - name: patch
        if: ${{ steps.version_number.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          # ── verify.c — signature bypass ──────────────────────────────────────────
          Write-Host "==> [verify.c] Searching for 'NTSTATUS KphVerifySignature'..."
          $verifyc = Get-Content "Sandboxie\core\drv\verify.c" -Raw
          $func_pos = $verifyc.IndexOf("NTSTATUS KphVerifySignature")
          if ($func_pos -lt 0) {
            Write-Error "verify.c: 'NTSTATUS KphVerifySignature' not found - upstream may have changed the function"
            exit 1
          }
          Write-Host "    target found at char $func_pos"
          $patch_pos = $verifyc.IndexOf("{",$func_pos)
          Write-Host "    opening brace found at char $patch_pos"
          $patched = $verifyc.Insert($patch_pos + 1,"return 0;")
          if ($patched -eq $verifyc) {
            Write-Error "verify.c: Insert produced no change - check patch logic"
            exit 1
          }
          $patched | Out-File -Encoding utf8 "Sandboxie\core\drv\verify.c"
          Write-Host "    [OK] verify.c patched (+$(($patched.Length - $verifyc.Length)) chars)"

          # ── process_util.c — exempt ForceFolder/inherited sandbox from ProtectHostImages (DuplicateHandle) ──
          # Fixes DuplicateHandle failures (Steam IPC) for games run via ForceFolder or inherited sandbox.
          # Exempts both directly-forced processes (forced_process=TRUE) and children of sandboxed parents
          # (parent_was_sandboxed=TRUE, set when the process inherited its box rather than being directly forced).
          Write-Host "==> [process_util.c] Searching for patch target..."
          $util = Get-Content "Sandboxie\core\drv\process_util.c" -Raw
          $old = '!proc2->image_from_box && proc2->protect_host_images && proc->image_from_box'
          $new = '!proc2->image_from_box && !proc2->forced_process && !proc2->parent_was_sandboxed && proc2->protect_host_images && proc->image_from_box'
          if (-not $util.Contains($old)) {
            Write-Error "process_util.c: patch target not found - upstream may have changed the condition"
            exit 1
          }
          Write-Host "    target found"
          $patched = $util.Replace($old, $new)
          if ($patched -eq $util) {
            Write-Error "process_util.c: Replace produced no change - target was found but substitution failed"
            exit 1
          }
          $patched | Out-File -Encoding utf8 "Sandboxie\core\drv\process_util.c"
          Write-Host "    [OK] process_util.c patched (+$(($patched.Length - $util.Length)) chars)"

          # ── file_flt.c — exempt ForceFolder/inherited sandbox from ProtectHostImages image load (SBIE1305) ──
          # Fixes SBIE1305 for both directly-forced (forced_process=TRUE) and inherited-sandbox
          # (parent_was_sandboxed=TRUE) host-exe processes loading sandboxed DLLs (e.g. Steam overlay).
          # parent_was_sandboxed is set in process.c when a process inherits its box from a sandboxed parent
          # instead of being directly matched by ForceFolder/ForceProgram.
          Write-Host "==> [file_flt.c] Searching for patch target..."
          $flt = Get-Content "Sandboxie\core\drv\file_flt.c" -Raw
          $old = '!proc->image_from_box && proc->protect_host_images && Data->Iopb->TargetFileObject'
          $new = '!proc->image_from_box && !proc->forced_process && !proc->parent_was_sandboxed && proc->protect_host_images && Data->Iopb->TargetFileObject'
          if (-not $flt.Contains($old)) {
            Write-Error "file_flt.c: patch target not found - upstream may have changed the condition"
            exit 1
          }
          Write-Host "    target found"
          $patched = $flt.Replace($old, $new)
          if ($patched -eq $flt) {
            Write-Error "file_flt.c: Replace produced no change - target was found but substitution failed"
            exit 1
          }
          $patched | Out-File -Encoding utf8 "Sandboxie\core\drv\file_flt.c"
          Write-Host "    [OK] file_flt.c patched (+$(($patched.Length - $flt.Length)) chars)"

          # ── process.c — propagate forced_process to children of forced parents ──
          # When a child process inherits its sandbox box from a forced (ForceFolder) parent,
          # it also inherits forced_process=TRUE so that the file_flt.c and process_util.c
          # patches correctly exempt it from ProtectHostImages restrictions.
          Write-Host "==> [process.c] Searching for patch target..."
          $proc = Get-Content "Sandboxie\core\drv\process.c" -Raw
          $old = 'if (parent_proc->is_start_exe)'
          $new = 'if (parent_proc->forced_process) process_is_forced = TRUE; if (parent_proc->is_start_exe)'
          if (-not $proc.Contains($old)) {
            Write-Error "process.c: patch target not found - upstream may have changed the parent inheritance block"
            exit 1
          }
          Write-Host "    target found"
          $patched = $proc.Replace($old, $new)
          if ($patched -eq $proc) {
            Write-Error "process.c: Replace produced no change - target was found but substitution failed"
            exit 1
          }
          $patched | Out-File -Encoding utf8 "Sandboxie\core\drv\process.c"
          Write-Host "    [OK] process.c patched (+$(($patched.Length - $proc.Length)) chars)"

          # ── process.c (SbieSvc path) — set forced_process=TRUE for host-exe processes started via SbieSvc ──
          # When a sandboxed process (e.g. GameVault) launches a game via ShellExecuteEx, SbieDll intercepts
          # and routes creation through SbieSvc, making ParentId == Api_ServiceProcessId in the kernel callback.
          # This fast-path skips both the parent-inheritance block (parent_was_sandboxed stays FALSE) and the
          # forced-program check (process_is_forced stays FALSE). Result: the game gets forced_process=FALSE AND
          # parent_was_sandboxed=FALSE, bypassing all ProtectHostImages exemptions in file_flt.c/process_util.c.
          #
          # Fix: append process_is_forced=TRUE after add_process_to_job=TRUE in the SbieSvc block,
          # located by "// 1.  process created by SbieSvc" + IndexOf to target only that occurrence.
          Write-Host "==> [process.c SbieSvc path] Searching for SbieSvc block..."
          $proc2 = Get-Content "Sandboxie\core\drv\process.c" -Raw
          $svc_comment = '// 1.  process created by SbieSvc'
          $svc_pos = $proc2.IndexOf($svc_comment)
          if ($svc_pos -lt 0) {
            Write-Error "process.c: SbieSvc comment not found - upstream may have changed the SbieSvc block"
            exit 1
          }
          Write-Host "    SbieSvc comment found at char $svc_pos"
          $apts_target = 'add_process_to_job = TRUE;'
          $apts_pos = $proc2.IndexOf($apts_target, $svc_pos)
          if ($apts_pos -lt 0) {
            Write-Error "process.c: 'add_process_to_job = TRUE;' not found after SbieSvc comment"
            exit 1
          }
          Write-Host "    'add_process_to_job = TRUE;' found at char $apts_pos"
          $insert_pos = $apts_pos + $apts_target.Length
          $patched2 = $proc2.Insert($insert_pos, " process_is_forced = TRUE;")
          if ($patched2 -eq $proc2) {
            Write-Error "process.c (SbieSvc): Insert produced no change"
            exit 1
          }
          $patched2 | Out-File -Encoding utf8 "Sandboxie\core\drv\process.c"
          Write-Host "    [OK] process.c SbieSvc path patched (+$(($patched2.Length - $proc2.Length)) chars)"

          # ── process.c (1418 gate) — exempt forced processes from ProtectHostImages pre-check ──
          # When an in-box parent (image_from_box=TRUE) CreateProcess's a host-image child,
          # the upstream gate at process.c:1418 terminates the child BEFORE the flags at
          # L1440/L1466 are set — so the exemptions in process_util.c/file_flt.c (patches
          # #2/#3, which read those flags) cannot rescue it. Use the LOCAL `process_is_forced`
          # variable which is already TRUE at this point (patch #4 sets it via parent inheritance).
          # Fixes: Locale Emulator (LEProc.exe) → host-path forced game failing with 0x80070005.
          Write-Host "==> [process.c 1418 gate] Searching for patch target..."
          $proc3 = Get-Content "Sandboxie\core\drv\process.c" -Raw
          $old = 'else if (!new_proc->image_from_box && new_proc->protect_host_images && parent_was_image_from_box) {'
          $new = 'else if (!new_proc->image_from_box && !process_is_forced && new_proc->protect_host_images && parent_was_image_from_box) {'
          if (-not $proc3.Contains($old)) {
            Write-Error "process.c: 1418 gate not found - upstream may have changed the pre-check"
            exit 1
          }
          Write-Host "    target found"
          $patched3 = $proc3.Replace($old, $new)
          if ($patched3 -eq $proc3) {
            Write-Error "process.c (1418 gate): Replace produced no change"
            exit 1
          }
          $patched3 | Out-File -Encoding utf8 "Sandboxie\core\drv\process.c"
          Write-Host "    [OK] process.c 1418 gate patched (+$(($patched3.Length - $proc3.Length)) chars)"

          # ── file_dir.c — return real-drive free/total for drive-ROOT size queries ──
          # When a boxed process queries disk size on a drive ROOT (e.g. .NET
          # DriveInfo("X:\").AvailableFreeSpace / GetDiskFreeSpaceExW("X:\"))
          # inside the box, Sandboxie's NtCreateFile hook redirects the open to
          # the box's copy-on-write shadow at C:\Sandbox\%User%\<box>\drive\<X>.
          # The existing File_NtQueryVolumeInformationFile hook attempts to re-open
          # the real drive via SbieDll_GetHandlePath, but for bare drive-root
          # handles that call returns STATUS_INVALID_PARAMETER_MIX (0xC000000A),
          # the NT_SUCCESS guard on the re-open branch fails, and the volume query
          # ends up on the box-shadow handle (hosted on C:), returning C:'s
          # free/total bytes - wrong answer for any launcher asking about a drive
          # other than the one hosting the box.
          #
          # Fix: after the existing re-open branch, add a fallback that fires only
          # for FileFsSizeInformation / FileFsFullSizeInformation on a boxed
          # handle we did NOT already re-open. It:
          #   1. Reads the handle's raw kernel name via Obj_GetObjectName (which
          #      goes through __sys_NtQueryObject, bypassing the hooked
          #      NtQueryObject that would otherwise transform the box-prefixed
          #      path into a logical form).
          #   2. Strips the Dll_BoxFilePath prefix and checks for "\drive\<X>" at
          #      the start of the remainder; if absent, the handle isn't for a
          #      drive root and the fallback skips (no driver round-trip).
          #   3. Resolves the real drive via File_GetDriveForLetter and asks the
          #      driver to open "\??\<X>:\" via SbieApi_OpenFile. User-mode
          #      NtOpenFile / NtCreateFile for this path is denied by the
          #      Sandboxie driver filter for boxed processes - SbieApi_OpenFile
          #      is the sanctioned route (used by file.c:5897 and file_copy.c:658)
          #      that opens the file in kernel mode and duplicates the handle
          #      back to the caller.
          # If the driver denies the open or any step fails, handle stays
          # FileHandle and the final volume query falls through to the box-shadow
          # handle (same as today's behaviour). No new privileges granted, no
          # bypass of UsePrivacyMode / ClosedFilePath / ProtectHostImages - size
          # info is a read-only scalar and SbieApi_OpenFile returns a
          # minimal-rights handle governed by the driver's own ACL checks.
          #
          # Fixes installers that false-alarm "not enough disk space" when the
          # install target is on a drive other than the one hosting the box
          # (first seen with a game launcher using DriveInfo.AvailableFreeSpace
          # on its own install directory root).
          Write-Host "==> [file_dir.c] Searching for File_NtQueryVolumeInformationFile insertion point..."
          $fdir = Get-Content "Sandboxie\core\dll\file_dir.c" -Raw
          $fn_pos = $fdir.IndexOf("_FX NTSTATUS File_NtQueryVolumeInformationFile(")
          if ($fn_pos -lt 0) {
            Write-Error "file_dir.c: function File_NtQueryVolumeInformationFile not found - upstream may have renamed it"
            exit 1
          }
          Write-Host "    function found at char $fn_pos"
          $anchorCRLF = "        Dll_Free(path);`r`n    }`r`n`r`n`r`n    status = __sys_NtQueryVolumeInformationFile("
          $anchorLF   = "        Dll_Free(path);`n    }`n`n`n    status = __sys_NtQueryVolumeInformationFile("
          $anchor = $null
          if     ($fdir.Contains($anchorCRLF)) { $anchor = $anchorCRLF; $nl = "`r`n" }
          elseif ($fdir.Contains($anchorLF))   { $anchor = $anchorLF;   $nl = "`n" }
          else {
            Write-Error "file_dir.c: insertion anchor (end of existing re-open block + status= call) not found - upstream may have changed the control flow"
            exit 1
          }
          $anchor_pos = $fdir.IndexOf($anchor, $fn_pos)
          if ($anchor_pos -lt 0) {
            Write-Error "file_dir.c: anchor exists but not inside File_NtQueryVolumeInformationFile"
            exit 1
          }
          Write-Host "    anchor found at char $anchor_pos"
          # Fallback C block to insert. Built with -join so newline convention matches file.
          $fallbackLines = @(
            '',
            '    //',
            '    // Fallback for drive-root handles: SbieDll_GetHandlePath returns',
            '    // STATUS_INVALID_PARAMETER_MIX for a handle to the bare box-shadow of a',
            '    // drive root (e.g. GetDiskFreeSpaceExW("G:\\") inside a box, where',
            '    // NtCreateFile redirected the open to C:\\Sandbox\\%User%\\<box>\\drive\\<X>).',
            '    // The re-open branch above is guarded by NT_SUCCESS(status) and does',
            '    // nothing for that case, so the query falls through to the box-shadow',
            '    // handle on the drive that holds the box (usually C:), returning the',
            '    // wrong drive''s bytes. Read the raw kernel name via NtQueryObject,',
            '    // strip the box prefix, parse "\\drive\\<X>", and open the real X: root.',
            '    //',
            '    if (handle == FileHandle && IsBoxedPath &&',
            '        (FsInformationClass == FileFsSizeInformation ||',
            '         FsInformationClass == FileFsFullSizeInformation))',
            '    {',
            '        WCHAR *kbuf = Dll_AllocTemp(8192);',
            '        if (kbuf) {',
            '            ULONG kbufLen = 8192;',
            '            // Obj_GetObjectName goes through __sys_NtQueryObject which',
            '            // bypasses the hooked Obj_NtQueryObject (that would otherwise',
            '            // transform the box-prefixed path to a logical form via',
            '            // File_NtQueryObjectName). We need the raw kernel name here so',
            '            // we can recognise the box prefix and extract the drive letter.',
            '            NTSTATUS objSt = Obj_GetObjectName(FileHandle, kbuf, &kbufLen);',
            '            if (NT_SUCCESS(objSt)) {',
            '                OBJECT_NAME_INFORMATION *oni = (OBJECT_NAME_INFORMATION*)kbuf;',
            '                WCHAR *kname = oni->Name.Buffer;',
            '                ULONG  klen  = oni->Name.Length / sizeof(WCHAR);',
            '                if (kname && Dll_BoxFilePathLen > 0 &&',
            '                    klen >= Dll_BoxFilePathLen &&',
            '                    0 == Dll_NlsStrCmp(kname, Dll_BoxFilePath, Dll_BoxFilePathLen))',
            '                {',
            '                    WCHAR *rem    = kname + Dll_BoxFilePathLen;',
            '                    ULONG  remlen = klen  - Dll_BoxFilePathLen;',
            '                    // Match box-prefix + "\drive\<X>" (drive root, remlen == 8)',
            '                    // or "\drive\<X>\<sub-path>" (remlen > 8). Both cases want the',
            '                    // volume info for drive X; a sub-path handle whose open was',
            '                    // COW-redirected to the box-shadow would otherwise return the',
            '                    // bytes of the drive hosting the box, not of drive X itself.',
            '                    if (remlen >= 8 && 0 == _wcsnicmp(rem, L"\\drive\\", 7)) {',
            '                        FILE_DRIVE *drive2 = File_GetDriveForLetter(rem[7]);',
            '                        if (drive2) {',
            '                            // User-mode NtOpenFile / NtCreateFile for "\\??\\<X>:\\"',
            '                            // returns STATUS_OBJECT_NAME_NOT_FOUND because the Sandboxie',
            '                            // driver filter denies drive-root opens from boxed processes.',
            '                            // SbieApi_OpenFile asks the driver to open the file in kernel',
            '                            // mode and duplicate the handle back to this process - the',
            '                            // same sanctioned route used by file.c:5897 and',
            '                            // file_copy.c:658 for other paths that user-mode cannot reach.',
            '                            WCHAR dosPath[8];',
            '                            dosPath[0] = L''\\''; dosPath[1] = L''?'';',
            '                            dosPath[2] = L''?'';  dosPath[3] = L''\\'';',
            '                            dosPath[4] = drive2->letter;',
            '                            dosPath[5] = L'':'';  dosPath[6] = L''\\'';',
            '                            dosPath[7] = L''\0'';',
            '                            HANDLE realHandle = NULL;',
            '                            LONG sbSt = SbieApi_OpenFile(&realHandle, dosPath);',
            '                            if (NT_SUCCESS(sbSt) && realHandle) {',
            '                                handle = realHandle;',
            '                            }',
            '                            LeaveCriticalSection(File_DrivesAndLinks_CritSec);',
            '                        }',
            '                    }',
            '                }',
            '            }',
            '            Dll_Free(kbuf);',
            '        }',
            '    }',
            ''
          )
          $fallbackBlock = ($fallbackLines -join $nl)
          $replacement = "        Dll_Free(path);${nl}    }${nl}${nl}${fallbackBlock}${nl}    status = __sys_NtQueryVolumeInformationFile("
          $patched = $fdir.Substring(0, $anchor_pos) + $replacement + $fdir.Substring($anchor_pos + $anchor.Length)
          if ($patched -eq $fdir) {
            Write-Error "file_dir.c: Replace produced no change"
            exit 1
          }
          $patched | Out-File -Encoding utf8 "Sandboxie\core\dll\file_dir.c"
          Write-Host "    [OK] file_dir.c patched (+$(($patched.Length - $fdir.Length)) chars)"

          Write-Host ""
          Write-Host "All 7 patches applied successfully."

      #
      # Build core components
      #
      - name: Build Sandboxie x86 (core DLLs and services)
        if: ${{ steps.version_number.outputs.skip != 'true' }}
        run: msbuild /t:build Sandboxie\SandboxDll.sln /p:Configuration="SbieRelease" /p:Platform=Win32 -maxcpucount:8

      - name: Build Sandboxie x64 (core suite)
        if: ${{ steps.version_number.outputs.skip != 'true' }}
        run: msbuild /t:build Sandboxie\Sandbox.sln /p:Configuration="SbieRelease" /p:Platform=x64 -maxcpucount:8

      - name: Build Sandboxie x64 (driver)
        if: ${{ steps.version_number.outputs.skip != 'true' }}
        run: msbuild /t:build Sandboxie\SandboxDrv.sln /p:Configuration="SbieRelease" /p:Platform=x64 -maxcpucount:8

      #
      # Build Sandboxie Plus UI
      #
      - name: Install Qt6
        if: ${{ steps.version_number.outputs.skip != 'true' }}
        shell: cmd
        run: |
          call SandboxiePlus\install_qt.cmd x64
          call SandboxiePlus\install_jom.cmd

      - name: Build Sandman UI
        if: ${{ steps.version_number.outputs.skip != 'true' }}
        shell: cmd
        run: call SandboxiePlus\qmake_plus.cmd x64 build_qt6

      - name: Restore NuGet packages (SbieShell)
        if: ${{ steps.version_number.outputs.skip != 'true' }}
        run: nuget restore SandboxiePlus\SbieShell\SbieShell.sln

      - name: Build SbieShell
        if: ${{ steps.version_number.outputs.skip != 'true' }}
        run: msbuild /t:build SandboxiePlus\SbieShell\SbieShell.sln /p:Configuration="Release" /p:Platform=x64 -maxcpucount:8

      - name: Build SandboxieTools
        if: ${{ steps.version_number.outputs.skip != 'true' }}
        run: msbuild /t:build SandboxieTools\SandboxieTools.sln /p:Configuration="Release" /p:Platform=x64 -maxcpucount:8

      #
      # Assemble release files
      #
      - name: Assemble release files
        if: ${{ steps.version_number.outputs.skip != 'true' }}
        shell: cmd
        run: |
          call Installer\fix_qt5_languages.cmd x64 build_qt6
          call Installer\get_openssl.cmd
          call Installer\get_7zip.cmd
          call Installer\copy_build.cmd x64 build_qt6

      - name: Copy extra driver files to release folder
        if: ${{ steps.version_number.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          # copy_build.cmd omits SbieMsg.pdb — copy it so it appears in Sandboxie-Plus-x64.zip too
          $bin = "Sandboxie\Bin\x64\SbieRelease"
          $dst = "Installer\SbiePlus_x64"
          @("SbieMsg.pdb") | ForEach-Object {
            if (Test-Path "$bin\$_") { Copy-Item "$bin\$_" $dst; Write-Host "Copied $_" }
            else { Write-Host "$_ not found in $bin, skipping" }
          }

      - name: Copy signing certificate to release folder
        if: ${{ steps.version_number.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          # Copy any .cer signing certificate from driver build output into the assembled release folder
          # so it appears in both SbieDrv.zip and Sandboxie-Plus-x64.zip
          Get-ChildItem "Sandboxie\Bin\x64\SbieRelease\*.cer" | ForEach-Object {
            Copy-Item $_.FullName "Installer\SbiePlus_x64\"; Write-Host "Copied $($_.Name)"
          }

      - name: Strip user INI files from release
        if: ${{ steps.version_number.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          'Sandboxie.ini','SbieSettings.ini','Sandboxie-Plus.ini' | ForEach-Object {
            $f = "Installer\SbiePlus_x64\$_"
            if (Test-Path $f) { Remove-Item $f; Write-Host "Removed $_" }
            else { Write-Host "$_ not present, skipping" }
          }

      - name: Archive driver only
        if: ${{ steps.version_number.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          # Source from raw build output — includes SbieMsg.pdb which copy_build.cmd omits
          $src = "Sandboxie\Bin\x64\SbieRelease"
          $candidates = @("$src\SbieDrv.sys","$src\SbieDrv.pdb","$src\SbieMsg.dll","$src\SbieMsg.pdb")
          $files = $candidates | Where-Object { Test-Path $_ }
          $files += Get-ChildItem "$src\*.cer" | Select-Object -ExpandProperty FullName
          Compress-Archive -Path $files -DestinationPath SbieDrv.zip

      - name: Archive full build
        if: ${{ steps.version_number.outputs.skip != 'true' }}
        shell: pwsh
        run: Compress-Archive Installer\SbiePlus_x64\* Sandboxie-Plus-x64.zip

      - name: Archive SbieMcp
        if: ${{ steps.version_number.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          # Also publish SbieMcp.exe standalone, matching upstream's SbieMcp.zip asset.
          # The binary is already inside Sandboxie-Plus-x64.zip; this is a
          # convenience zip for users who only want the MCP bridge.
          $src = "Installer\SbiePlus_x64"
          $files = @("$src\SbieMcp.exe","$src\SbieMcp.pdb") | Where-Object { Test-Path $_ }
          if ($files.Count -ge 1) {
            Compress-Archive -Path $files -DestinationPath SbieMcp.zip -Force
            Write-Host "Packed SbieMcp.zip with $($files.Count) file(s)"
          } else {
            Write-Host "SbieMcp.exe not present in SbiePlus_x64 - skipping SbieMcp.zip"
          }

      - name: Hash driver archive
        if: ${{ steps.version_number.outputs.skip != 'true' }}
        shell: pwsh
        run: (Get-FileHash SbieDrv.zip).Hash + "  SbieDrv.zip" | Out-File -Encoding utf8 SbieDrv.zip.sha256

      - name: generate certificate
        if: ${{ steps.version_number.outputs.skip != 'true' }}
        shell: bash
        run: |
          echo -e "NAME: Sandboxie Tester\nTYPE: ETERNAL\nDATE: 01.01.1970\nSIGNATURE: b25seSBmb3IgdGVzdCBwdXJwb3Nl" > Certificate.dat

      #
      # Release
      #
      - name: Release
        if: ${{ steps.version_number.outputs.skip != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SbieDrv.zip
            SbieDrv.zip.sha256
            Sandboxie-Plus-x64.zip
            SbieMcp.zip
            Certificate.dat
          token: ${{ secrets.RELEASE_TOKEN }}
          name: ${{ steps.version_number.outputs.SBIEVERSION }}
          tag_name: ${{ steps.version_number.outputs.SBIEVERSION }}
          body: |
            Sandboxie-Plus patched build based on upstream ${{ steps.version_number.outputs.SBIEVERSION }}.

            **Patches applied:**
            - `verify.c`: signature verification bypassed for test-signing mode
            - `process_util.c`: ForceFolder processes exempt from ProtectHostImages restriction (fixes Steam IPC DuplicateHandle failures)
            - `file_flt.c`: ForceFolder processes exempt from sandboxed image load block (fixes SBIE1305 for games run via ForceFolder)
            - `process.c` (1418 gate): forced processes exempt from ProtectHostImages pre-check (fixes Locale Emulator / in-box parent launching host-path forced games with 0x80070005)
            - `file_dir.c`: drive-root `DriveInfo.AvailableFreeSpace` / `GetDiskFreeSpaceExW` queries now return the REAL drive's free/total bytes instead of the box-copy drive's bytes. Fallback added to `File_NtQueryVolumeInformationFile`: for boxed handles where `SbieDll_GetHandlePath` fails to resolve the true path (as it does for bare drive-root handles), parse the handle's raw kernel name via `Obj_GetObjectName`, strip the box prefix, extract the drive letter from the `\drive\<X>` suffix, and open the real `\??\<X>:\` via `SbieApi_OpenFile` (driver-mediated open, same mechanism `file.c:5897` already uses). No new privileges, no bypass of existing box rules — size info is a read-only scalar. Fixes installers that false-alarm "not enough disk space" when the install target is on a drive other than the one hosting the box.

            **Downloads:**
            - `Sandboxie-Plus-x64.zip` — full installation (Sandman UI + all components)
            - `SbieDrv.zip` — driver only, for updating an existing installation
            - `SbieMcp.zip` — standalone MCP stdio bridge (also included in full zip)

            **Certificate.dat example** (for test-signing mode):
            ```
            NAME: Sandboxie Tester
            TYPE: ETERNAL
            DATE: 01.01.1970
            SIGNATURE: b25seSBmb3IgdGVzdCBwdXJwb3Nl
            ```
